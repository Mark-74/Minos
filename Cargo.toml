[workspace]
resolver = "2"
members = [
    "crates/minos-core",
    "crates/minos-storage",
    "crates/minos-config",
    "crates/minos-proxy",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/balduccimarco/minos"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "1", features = ["uuid1"] }
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
async-trait = "0.1"
httparse = "1"
socket2 = "0.6"
tracing = "0.1"
# Test-only dependencies (consumers should declare under [dev-dependencies]).
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
