# Minos — one-command deployment. See docs/operator/install.md for details.
#
#   docker compose up --build
#
# The web UI is then on http://<host>:8080 (first login sets the password).
services:
  minos:
    build: .
    # Map the web UI. Add one published port per reverse-proxy service you
    # configure (the in-container bind addresses come from the saved config).
    ports:
      - "8080:8080"
    environment:
      # Defaults shown; override as needed.
      MINOS_DB: /data/minos.db
      MINOS_WEB_BIND: 0.0.0.0:8080
      MINOS_VENV_ROOT: /data/venvs
      MINOS_SOCKET_DIR: /run/minos/sidecars
      RUST_LOG: info
    volumes:
      # Persist the config history (SQLite) and the deduped sidecar venvs.
      - minos-data:/data
    # Transparent mode (iptables REDIRECT + SO_ORIGINAL_DST) needs NET_ADMIN.
    # Harmless for reverse-proxy-only deployments. For transparent mode you
    # will typically also want `network_mode: host` instead of `ports:`.
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

volumes:
  minos-data:
