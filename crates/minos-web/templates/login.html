{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="login">
  <h1>Login</h1>
  {% if let Some(err) = error %}<p class="error">{{ err }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input type="password" name="password" id="password" autofocus>
    <button type="submit">Sign in</button>
  </form>
  {% if first_run %}<p class="hint">first run: the password you enter now becomes the shared password.</p>{% endif %}
</section>
{% endblock %}
